<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de Negocio</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2230;--mut:#6b7385;--pri:#2457e6;--ok:#12805c;--bad:#c62f2f;--warn:#b7791f;--line:#e3e6ec}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--ink:#e8ebf3;--mut:#8f98ad;--line:#2b3247;--pri:#6c8cff;--ok:#3ec997;--bad:#ff6b6b;--warn:#f0b34a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
main{max-width:1000px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;max-width:1000px;margin:0 auto}
nav button{white-space:nowrap}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on,button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.del{color:var(--bad)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
label{display:block;font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{color:var(--mut);display:block}
.kpi b{font-size:18px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px}
td.n,th.n{text-align:right}
.mut{color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>Panel de Negocio</h1>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <input type="search" id="q" placeholder="Buscar en esta pestaña…" style="width:210px" oninput="st.q=this.value;applyFilter()">
    <select id="month" style="width:auto" onchange="st.month=this.value;render()"></select>
    <button onclick="exportData()">Exportar</button>
    <button onclick="document.getElementById('imp').click()">Importar</button>
    <input type="file" id="imp" accept="application/json" hidden onchange="importData(event)">
  </div>
</header>
<nav id="nav"></nav>
<main id="view"></main>

<script>
const KEY='panel-negocio-v1';
const CH=['WhatsApp','Facebook','Instagram','TikTok','Marketplace','Google','Presencial','Otro'];
const empty=()=>({products:[],sales:[],ads:[],defects:[],batches:[]});
let db=load();
let st={tab:'resumen',month:'all',q:''};
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function applyFilter(){
  const words=norm(st.q||'').split(/\s+/).filter(Boolean);
  document.querySelectorAll('#view table:not([data-nofilter])').forEach(t=>{
    t.querySelectorAll('tr').forEach(tr=>{
      if(!tr.querySelector('td'))return;
      const first=norm(tr.cells[0].textContent.trim());
      if(first==='total'){tr.style.display=words.length?'none':'';return}
      const txt=norm(tr.textContent);
      tr.style.display=words.every(w=>txt.includes(w))?'':'none';
    });
  });
}

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d?Object.assign(empty(),d):empty()}catch(e){return empty()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function commit(){save();render()}

const $=s=>document.querySelector(s);
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const gs=n=>new Intl.NumberFormat('es-PY').format(Math.round(n||0))+' Gs';
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prod=id=>db.products.find(p=>p.id===id);
const pname=id=>prod(id)?esc(prod(id).name):'(eliminado)';
const inR=x=>st.month==='all'||x.date.startsWith(st.month);
const months=()=>[...new Set([...db.sales,...db.ads,...db.defects,...db.batches].map(x=>x.date.slice(0,7)))].sort().reverse();
const byDate=a=>a.slice().sort((x,y)=>y.date.localeCompare(x.date));
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
const kpi=(l,v,c)=>`<div class="kpi"><small>${l}</small><b class="${c||''}">${v}</b></div>`;
const chOpts=()=>CH.map(c=>`<option>${c}</option>`).join('');
const prodOpts=()=>db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
const go=t=>{st.tab=t;render()};

function stats(){
  const S=db.sales.filter(inR),A=db.ads.filter(inR),D=db.defects.filter(inR);
  const rev=sum(S,s=>s.qty*s.price),cogs=sum(S,s=>s.qty*s.unitCost);
  const ads=sum(A,a=>a.amount),shipCost=sum(S,s=>s.shipCost),shipCh=sum(S,s=>s.shipCharged);
  const loss=sum(D.filter(d=>!d.warranty),d=>d.qty*d.unitCost);
  const freight=sum(db.batches.filter(inR),b=>b.shipCost);
  return {S,A,D,rev,cogs,ads,shipCost,shipCh,loss,freight,gross:rev-cogs,net:rev-cogs-ads-(shipCost-shipCh)-loss};
}

/* ---------- vistas ---------- */
function resumen(){
  const s=stats();
  const low=db.products.filter(p=>p.stock<=p.min);
  const by={};s.S.forEach(x=>by[x.productId]=(by[x.productId]||0)+x.qty*(x.price-x.unitCost));
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class="kpis">
    ${kpi('Ventas',gs(s.rev))}${kpi('Ganancia bruta',gs(s.gross))}${kpi('Publicidad',gs(s.ads))}
    ${kpi('Envíos a clientes (neto)',gs(s.shipCost-s.shipCh))}${kpi('Fletes de tandas (ya en el costo)',gs(s.freight))}${kpi('Pérdida por fallas',gs(s.loss),s.loss?'bad':'')}
    ${kpi('Ganancia neta',gs(s.net),s.net>=0?'ok':'bad')}${kpi('ROAS (ventas/publicidad)',s.ads?(s.rev/s.ads).toFixed(2)+'x':'—')}
    ${kpi('Unidades vendidas',sum(s.S,x=>x.qty))}</div>
  <div class="card"><h3>Stock bajo</h3>${low.length?low.map(p=>`<div>${esc(p.name)}: <b class="${p.stock<=0?'bad':'warn'}">${p.stock}</b> <span class="mut">(mínimo ${p.min})</span></div>`).join(''):'<span class="mut">Todo en orden.</span>'}</div>
  <div class="card"><h3>Top productos por ganancia</h3>${top.length?top.map(([id,v])=>`<div>${pname(id)}: <b>${gs(v)}</b></div>`).join(''):'<span class="mut">Sin ventas en este período.</span>'}</div>`;
}

function ventas(){
  const rows=byDate(db.sales.filter(inR));
  const form=db.products.length?`<form class="form" onsubmit="addSale(event)">
    <div><label>Fecha</label><input type="date" name="date" value="${today()}" required></div>
    <div><label>Producto</label><select name="productId" onchange="prefill(this)" required>${prodOpts()}</select></div>
    <div><label>Cantidad</label><input type="number" name="qty" min="1" value="1" required></div>
    <div><label>Precio unitario (Gs)</label><input type="number" name="price" min="0" value="${db.products[0].price}" required></div>
    <div><label>Canal</label><select name="channel">${chOpts()}</select></div>
    <div><label>Courier / destino</label><input name="courier"></div>
    <div><label>Costo envío (Gs)</label><input type="number" name="shipCost" min="0" value="0"></div>
    <div><label>Envío cobrado (Gs)</label><input type="number" name="shipCharged" min="0" value="0"></div>
    <div><label>Nota / cliente</label><input name="note"></div>
    <button class="pri">Registrar venta</button></form>`:'<span class="mut">Primero cargá productos en Inventario.</span>';
  return `<div class="card"><h3>Nueva venta</h3>${form}</div>
  <div class="card tw"><h3>Ventas (${rows.length})</h3><table><tr><th>Fecha</th><th>Producto</th><th class="n">Cant.</th><th class="n">Total</th><th class="n">Ganancia</th><th>Canal</th><th>Nota</th><th></th></tr>
  ${rows.map(s=>`<tr><td>${s.date}</td><td>${pname(s.productId)}</td><td class="n">${s.qty}</td><td class="n">${gs(s.qty*s.price)}</td><td class="n">${gs(s.qty*(s.price-s.unitCost))}</td><td>${esc(s.channel)}</td><td>${esc(s.note)}</td><td><button class="del" onclick="delSale('${s.id}')">×</button></td></tr>`).join('')}</table></div>`;
}

function inventario(){
  return `<div class="card"><h3>Nuevo producto</h3><form class="form" onsubmit="addProduct(event)">
    <div><label>Nombre</label><input name="name" required></div>
    <div><label>Costo (Gs)</label><input type="number" name="cost" min="0" required></div>
    <div><label>Precio venta (Gs)</label><input type="number" name="price" min="0" required></div>
    <div><label>Stock inicial</label><input type="number" name="stock" min="0" value="0"></div>
    <div><label>Stock mínimo</label><input type="number" name="min" min="0" value="2"></div>
    <button class="pri">Agregar</button></form></div>
  <div class="card tw"><h3>Inventario</h3><table><tr><th>Producto</th><th class="n">Costo (con flete)</th><th class="n">Precio</th><th class="n">Margen</th><th class="n">Stock</th><th class="n">Valor en stock</th><th></th></tr>
  ${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="n">${gs(p.cost)}</td><td class="n">${gs(p.price)}</td><td class="n">${p.price?Math.round((p.price-p.cost)/p.price*100):0}%</td>
  <td class="n ${p.stock<=0?'bad':p.stock<=p.min?'warn':''}"><b>${p.stock}</b></td><td class="n">${gs(p.stock*p.cost)}</td>
  <td><button onclick="addStock('${p.id}')">+ Stock</button> <button onclick="editProduct('${p.id}')">Editar</button> <button class="del" onclick="delProduct('${p.id}')">×</button></td></tr>`).join('')}
  <tr><td><b>Total</b></td><td></td><td></td><td></td><td class="n"><b>${sum(db.products,p=>p.stock)}</b></td><td class="n"><b>${gs(sum(db.products,p=>p.stock*p.cost))}</b></td><td></td></tr></table></div>`;
}

function publicidad(){
  const s=stats();
  const plats=CH.map(c=>({c,inv:sum(s.A.filter(a=>a.platform===c),a=>a.amount),rev:sum(s.S.filter(x=>x.channel===c),x=>x.qty*x.price)})).filter(x=>x.inv||x.rev);
  return `<div class="card"><h3>Nuevo gasto de publicidad</h3><form class="form" onsubmit="addAd(event)">
    <div><label>Fecha</label><input type="date" name="date" value="${today()}" required></div>
    <div><label>Plataforma</label><select name="platform">${chOpts()}</select></div>
    <div><label>Campaña</label><input name="campaign"></div>
    <div><label>Monto (Gs)</label><input type="number" name="amount" min="0" required></div>
    <button class="pri">Registrar</button></form></div>
  <div class="card tw"><h3>Retorno por canal</h3><table><tr><th>Canal</th><th class="n">Invertido</th><th class="n">Ventas del canal</th><th class="n">ROAS</th></tr>
  ${plats.map(p=>`<tr><td>${p.c}</td><td class="n">${gs(p.inv)}</td><td class="n">${gs(p.rev)}</td><td class="n">${p.inv?(p.rev/p.inv).toFixed(2)+'x':'—'}</td></tr>`).join('')}</table>
  <p class="mut">Para que el ROAS sirva, elegí el canal correcto en cada venta.</p></div>
  <div class="card tw"><h3>Gastos</h3><table><tr><th>Fecha</th><th>Plataforma</th><th>Campaña</th><th class="n">Monto</th><th></th></tr>
  ${byDate(s.A).map(a=>`<tr><td>${a.date}</td><td>${esc(a.platform)}</td><td>${esc(a.campaign)}</td><td class="n">${gs(a.amount)}</td><td><button class="del" onclick="delAd('${a.id}')">×</button></td></tr>`).join('')}</table></div>`;
}

function envios(){
  const s=stats();const rows=byDate(s.S.filter(x=>x.shipCost||x.shipCharged));
  return `<div class="kpis">${kpi('Envíos',rows.length)}${kpi('Costo total',gs(s.shipCost))}${kpi('Cobrado a clientes',gs(s.shipCh))}
    ${kpi('Diferencia',gs(s.shipCh-s.shipCost),s.shipCh-s.shipCost>=0?'ok':'bad')}${kpi('Costo promedio',gs(rows.length?s.shipCost/rows.length:0))}</div>
  <div class="card tw"><h3>Envíos a clientes</h3><p class="mut">Se cargan al registrar la venta. El flete de lo que te llega del proveedor va en Tandas.</p><table><tr><th>Fecha</th><th>Producto</th><th>Courier / destino</th><th class="n">Costo</th><th class="n">Cobrado</th><th class="n">Diferencia</th></tr>
  ${rows.map(x=>`<tr><td>${x.date}</td><td>${pname(x.productId)}</td><td>${esc(x.courier)}</td><td class="n">${gs(x.shipCost)}</td><td class="n">${gs(x.shipCharged)}</td><td class="n ${x.shipCharged>=x.shipCost?'ok':'bad'}">${gs(x.shipCharged-x.shipCost)}</td></tr>`).join('')}</table></div>`;
}

function fallas(){
  const s=stats();
  const form=db.products.length?`<form class="form" onsubmit="addDefect(event)">
    <div><label>Fecha</label><input type="date" name="date" value="${today()}" required></div>
    <div><label>Producto</label><select name="productId">${prodOpts()}</select></div>
    <div><label>Cantidad</label><input type="number" name="qty" min="1" value="1" required></div>
    <div><label>Falla</label><input name="reason" required></div>
    <div><label>Proveedor</label><input name="supplier"></div>
    <div><label><input type="checkbox" name="warranty" style="width:auto"> Tiene garantía (no es pérdida)</label></div>
    <button class="pri">Registrar falla</button></form>`:'<span class="mut">Primero cargá productos en Inventario.</span>';
  return `<div class="kpis">${kpi('Unidades con falla',sum(s.D,d=>d.qty))}${kpi('Pérdida (sin garantía)',gs(s.loss),s.loss?'bad':'')}</div>
  <div class="card"><h3>Nueva falla</h3>${form}<p class="mut">Descuenta el producto del stock.</p></div>
  <div class="card tw"><h3>Historial</h3><table><tr><th>Fecha</th><th>Producto</th><th class="n">Cant.</th><th>Falla</th><th>Proveedor</th><th>Garantía</th><th class="n">Pérdida</th><th></th></tr>
  ${byDate(s.D).map(d=>`<tr><td>${d.date}</td><td>${pname(d.productId)}</td><td class="n">${d.qty}</td><td>${esc(d.reason)}</td><td>${esc(d.supplier)}</td><td>${d.warranty?'Sí':'No'}</td><td class="n">${d.warranty?'—':gs(d.qty*d.unitCost)}</td><td><button class="del" onclick="delDefect('${d.id}')">×</button></td></tr>`).join('')}</table></div>`;
}

/* ---------- tandas (compras con flete) ---------- */
const newDraft=()=>({date:today(),supplier:'',shipCost:0,method:'value',note:'',items:[]});
let draft=newDraft();
function alloc(d){
  const tq=sum(d.items,i=>i.qty),tv=sum(d.items,i=>i.qty*i.unitPrice),fc=+d.shipCost||0;
  return d.items.map(i=>{
    const share=!fc?0:d.method==='units'?(tq?fc*i.qty/tq:0):(tv?fc*i.qty*i.unitPrice/tv:0);
    return {...i,share,landed:i.unitPrice+(i.qty?share/i.qty:0)};
  });
}
function tandas(){
  const A=alloc(draft),tq=sum(draft.items,i=>i.qty),tv=sum(draft.items,i=>i.qty*i.unitPrice);
  const B=byDate(db.batches.filter(inR));
  if(!db.products.length)return '<div class="card"><span class="mut">Primero cargá productos en Inventario.</span></div>';
  return `<div class="card"><h3>Nueva tanda</h3>
  <p class="mut">Cargá lo que te llegó y cuánto costó el envío de esa tanda. El envío se reparte entre los productos y se suma a su costo (promedio ponderado con el stock que ya tenías).</p>
  <div class="form">
    <div><label>Fecha</label><input type="date" value="${draft.date}" oninput="draft.date=this.value"></div>
    <div><label>Proveedor / origen</label><input value="${esc(draft.supplier)}" oninput="draft.supplier=this.value"></div>
    <div><label>Costo total del envío (Gs)</label><input type="number" min="0" value="${draft.shipCost}" oninput="draft.shipCost=+this.value||0" onchange="render()"></div>
    <div><label>Repartir el envío por</label><select onchange="draft.method=this.value;render()"><option value="value" ${draft.method==='value'?'selected':''}>Valor del producto</option><option value="units" ${draft.method==='units'?'selected':''}>Unidades</option></select></div>
    <div><label>Nota</label><input value="${esc(draft.note)}" oninput="draft.note=this.value"></div>
  </div>
  <form class="form" style="margin-top:12px" onsubmit="addLine(event)">
    <div><label>Producto</label><select name="productId">${prodOpts()}</select></div>
    <div><label>Cantidad</label><input type="number" name="qty" min="1" value="1" required></div>
    <div><label>Precio unitario sin envío (Gs)</label><input type="number" name="unitPrice" min="0" required></div>
    <button>+ Agregar a la tanda</button>
  </form>
  ${draft.items.length?`<div class="tw" style="margin-top:12px"><table data-nofilter><tr><th>Producto</th><th class="n">Cant.</th><th class="n">Precio unit.</th><th class="n">Envío repartido</th><th class="n">Costo real unit.</th><th></th></tr>
  ${A.map((i,k)=>`<tr><td>${pname(i.productId)}</td><td class="n">${i.qty}</td><td class="n">${gs(i.unitPrice)}</td><td class="n">${gs(i.share)}</td><td class="n"><b>${gs(i.landed)}</b></td><td><button class="del" onclick="delLine(${k})">×</button></td></tr>`).join('')}
  <tr><td><b>Total</b></td><td class="n"><b>${tq}</b></td><td class="n"><b>${gs(tv)}</b></td><td class="n"><b>${gs(draft.shipCost)}</b></td><td class="n"><b>${gs(tv+(+draft.shipCost||0))}</b></td><td></td></tr></table></div>
  <div style="margin-top:12px;display:flex;gap:8px"><button class="pri" onclick="saveBatch()">Guardar tanda (suma stock y actualiza costos)</button><button onclick="draft=newDraft();render()">Vaciar</button></div>`:''}
  </div>
  <div class="card tw"><h3>Historial de tandas (${B.length})</h3><table><tr><th>Fecha</th><th>Proveedor</th><th>Productos</th><th class="n">Unid.</th><th class="n">Mercadería</th><th class="n">Envío</th><th class="n">Envío %</th><th></th></tr>
  ${B.map(b=>{const u=sum(b.items,i=>i.qty),m=sum(b.items,i=>i.qty*i.unitPrice);return `<tr><td>${b.date}</td><td>${esc(b.supplier)}</td><td style="white-space:normal;min-width:180px">${b.items.map(i=>pname(i.productId)+' ×'+i.qty).join(', ')}</td><td class="n">${u}</td><td class="n">${gs(m)}</td><td class="n">${gs(b.shipCost)}</td><td class="n">${m?Math.round(b.shipCost/m*100):0}%</td><td><button class="del" onclick="delBatch('${b.id}')">×</button></td></tr>`}).join('')}</table></div>`;
}
function addLine(e){const f=fd(e);draft.items.push({productId:f.productId,qty:+f.qty,unitPrice:+f.unitPrice});render()}
function delLine(k){draft.items.splice(k,1);render()}
function saveBatch(){
  if(!draft.items.length)return;
  const A=alloc(draft);
  A.forEach(i=>{const p=prod(i.productId);if(!p)return;const old=Math.max(0,p.stock);
    p.cost=Math.round((old*p.cost+i.qty*i.landed)/(old+i.qty));p.stock+=i.qty});
  db.batches.push({id:uid(),date:draft.date,supplier:draft.supplier,shipCost:+draft.shipCost||0,method:draft.method,note:draft.note,
    items:A.map(i=>({productId:i.productId,qty:i.qty,unitPrice:i.unitPrice,landed:i.landed}))});
  draft=newDraft();commit();
}
function delBatch(id){const b=db.batches.find(x=>x.id===id);if(!b||!confirm('¿Borrar tanda? Se resta el stock que sumó, pero el costo promedio de los productos NO se recalcula (ajustalo con Editar si hace falta).'))return;
  b.items.forEach(i=>{const p=prod(i.productId);if(p)p.stock=Math.max(0,p.stock-i.qty)});db.batches=db.batches.filter(x=>x.id!==id);commit()}

/* ---------- acciones ---------- */
function prefill(sel){const p=prod(sel.value);if(p)sel.form.price.value=p.price}
function addSale(e){const f=fd(e),p=prod(f.productId);if(!p)return;const qty=+f.qty;
  if(qty>p.stock&&!confirm(`Stock disponible: ${p.stock}. ¿Registrar igual?`))return;
  p.stock-=qty;
  db.sales.push({id:uid(),date:f.date,productId:p.id,qty,price:+f.price,unitCost:p.cost,channel:f.channel,courier:f.courier,shipCost:+f.shipCost||0,shipCharged:+f.shipCharged||0,note:f.note});commit()}
function delSale(id){const s=db.sales.find(x=>x.id===id);if(!s||!confirm('¿Borrar venta? El stock se repone.'))return;const p=prod(s.productId);if(p)p.stock+=s.qty;db.sales=db.sales.filter(x=>x.id!==id);commit()}
function addProduct(e){const f=fd(e);db.products.push({id:uid(),name:f.name,cost:+f.cost,price:+f.price,stock:+f.stock||0,min:+f.min||0});commit()}
function addStock(id){const n=parseInt(prompt('¿Cuántas unidades ingresaron?'),10);if(n>0){prod(id).stock+=n;commit()}}
function editProduct(id){const p=prod(id);const c=prompt('Costo (Gs)',p.cost);if(c===null)return;const v=prompt('Precio de venta (Gs)',p.price);if(v===null)return;const m=prompt('Stock mínimo',p.min);if(m===null)return;
  p.cost=+c||0;p.price=+v||0;p.min=+m||0;commit()}
function delProduct(id){if(confirm('¿Borrar producto? Las ventas anteriores se conservan.')){db.products=db.products.filter(p=>p.id!==id);commit()}}
function addAd(e){const f=fd(e);db.ads.push({id:uid(),date:f.date,platform:f.platform,campaign:f.campaign,amount:+f.amount});commit()}
function delAd(id){if(confirm('¿Borrar gasto?')){db.ads=db.ads.filter(a=>a.id!==id);commit()}}
function addDefect(e){const f=fd(e),p=prod(f.productId);if(!p)return;const qty=+f.qty;p.stock=Math.max(0,p.stock-qty);
  db.defects.push({id:uid(),date:f.date,productId:p.id,qty,reason:f.reason,supplier:f.supplier,warranty:!!f.warranty,unitCost:p.cost});commit()}
function delDefect(id){const d=db.defects.find(x=>x.id===id);if(!d||!confirm('¿Borrar registro? El stock se repone.'))return;const p=prod(d.productId);if(p)p.stock+=d.qty;db.defects=db.defects.filter(x=>x.id!==id);commit()}

function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='datos-negocio-'+today()+'.json';a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Esto reemplaza los datos actuales. ¿Continuar?'))return;db=Object.assign(empty(),d);commit()}catch(err){alert('Archivo inválido')}};r.readAsText(f);e.target.value=''}

function render(){
  const tabs=[['resumen','Resumen'],['ventas','Ventas'],['inventario','Inventario'],['tandas','Tandas'],['publicidad','Publicidad'],['envios','Envío clientes'],['fallas','Fallas']];
  if(st.month!=='all'&&!months().includes(st.month))st.month='all';
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${st.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  $('#month').innerHTML='<option value="all">Todo el tiempo</option>'+months().map(m=>`<option>${m}</option>`).join('');
  $('#month').value=st.month;
  $('#view').innerHTML=({resumen,ventas,inventario,tandas,publicidad,envios,fallas})[st.tab]();
  applyFilter();
}
render();
</script>
</body>
</html>
